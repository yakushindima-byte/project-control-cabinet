<style>
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --ink:#0F1B2D; --muted:#5B6A80; --line:#DCE2EA; --line2:#E9EDF3;
  --navy:#0B1F3A; --navyInk:#DCE8FA; --navyMuted:#8FA6C6; --accent:#1565C0;
  --good:#D7F2DD; --goodInk:#11652B; --warn:#FFF0C2; --warnInk:#8A5A00; --bad:#FBD3D6; --badInk:#A0101C;
  --info:#DCEAFB; --infoInk:#15457A; --neutral:#E7EAEE; --neutralInk:#4B5563;
  --bar:#A9CBF2; --barDone:#1565C0; --barBad:#E57373; --barLag:#FFB74D; --today:#F2B705; --todaySoft:#FFF3C4; --cGreen:#2E7D32;
  --shadow:0 1px 2px rgba(11,31,58,.06),0 4px 14px rgba(11,31,58,.05);
  --f-ui:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; --f-disp:"Unbounded","Golos Text",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root{
  --bg:#0A111D; --surface:#111A2A; --ink:#E6ECF5; --muted:#8C9AB0; --line:#22314A; --line2:#1A2639;
  --navy:#060C17; --navyInk:#DCE8FA; --navyMuted:#7D93B3; --accent:#5B9BEF;
  --good:#123A22; --goodInk:#7EE0A0; --warn:#3B2F0E; --warnInk:#F5C95A; --bad:#46161C; --badInk:#FF9AA4;
  --info:#152E50; --infoInk:#9CC3FF; --neutral:#202B3B; --neutralInk:#AAB5C5;
  --bar:#2C4C78; --barDone:#5B9BEF; --barBad:#C65757; --barLag:#D68A2C; --today:#F2B705; --todaySoft:#3A3110; --cGreen:#5BBF6A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark }}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
.hero{background:var(--navy);color:#fff;padding:calc(26px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) 30px max(20px,env(safe-area-inset-left,0px))}
.wrap{max-width:1080px;margin:0 auto}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--today)}
h1{font-family:var(--f-disp);font-size:clamp(20px,3.4vw,30px);line-height:1.2;margin:8px 0 12px;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:13px;color:var(--navyInk)}
.meta span b{font-weight:600;color:#fff}
.meta small{display:block;font-size:11px;color:var(--navyMuted);letter-spacing:.3px}
main{padding:20px max(20px,env(safe-area-inset-right,0px)) 40px max(20px,env(safe-area-inset-left,0px))}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);min-width:0}
.tile small{display:block;font-size:11.5px;color:var(--muted);font-weight:600}
.tile b{display:block;font-family:var(--f-disp);font-size:22px;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted)}
.tile .pb{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:8px}
.tile .pb i{display:block;height:100%;background:var(--cGreen)}
.tile b.warn{color:var(--warnInk)} .tile b.badc{color:var(--badInk)}
h2{font-size:12px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);margin:26px 0 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
table{border-collapse:collapse;width:100%;font-size:13px}
th{background:var(--navy);color:#fff;font-size:11px;font-weight:600;text-align:left;padding:9px 12px;white-space:nowrap}
td{padding:10px 12px;border-top:1px solid var(--line2);vertical-align:middle}
td.d,th.d{text-align:center;white-space:nowrap;font-variant-numeric:tabular-nums}
td.late{color:var(--badInk);font-weight:600}
.nm b{font-weight:600} .nm small{display:block;color:var(--muted);font-size:11.5px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:10px;white-space:nowrap;line-height:1.5}
.p-g{background:var(--good);color:var(--goodInk)} .p-w{background:var(--warn);color:var(--warnInk)} .p-b{background:var(--bad);color:var(--badInk)} .p-i{background:var(--info);color:var(--infoInk)} .p-n{background:var(--neutral);color:var(--neutralInk)}
.mbar{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums;font-weight:600}
.mbar u{display:block;flex:1;min-width:50px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.mbar u s{display:block;height:100%;background:var(--cGreen)}
.cards{display:none;gap:10px}
.st{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.st header{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;margin-bottom:8px}
.st header b{font-size:15px;line-height:1.3}
.st dl{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin:10px 0 0}
.st dt{font-size:11px;color:var(--muted)} .st dd{margin:0;font-size:13px;font-variant-numeric:tabular-nums}
.gantt{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);box-shadow:var(--shadow)}
.g-in{position:relative}
.g-row{display:grid;grid-template-columns:220px minmax(0,1fr);border-bottom:1px solid var(--line2);min-height:30px}
.g-row:last-child{border-bottom:0}
.g-lab{padding:6px 12px;font-size:12px;line-height:1.3;border-right:1px solid var(--line);position:sticky;left:0;background:var(--surface);z-index:2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-tr{position:relative}
.g-row:not(.g-head) .g-tr{background-image:repeating-linear-gradient(to right, transparent 0, transparent calc(100% / var(--w) - 1px), var(--line2) calc(100% / var(--w) - 1px), var(--line2) calc(100% / var(--w)))}
.g-now{position:absolute;top:0;bottom:0;background:var(--todaySoft);z-index:0}
.g-bar{position:absolute;top:8px;height:14px;border-radius:3px;background:var(--bar);overflow:hidden;z-index:1}
.g-bar s{display:block;height:100%;background:var(--barDone)}
.g-bar.bad{background:var(--barBad)} .g-bar.bad s{background:transparent} .g-bar.lag{background:var(--barLag)}
.g-tail{position:absolute;top:13px;height:4px;border-radius:0 2px 2px 0;z-index:1;background:repeating-linear-gradient(90deg,var(--barBad) 0 4px,transparent 4px 7px)}
.g-head{position:sticky;top:0;z-index:3;background:var(--navy);color:#fff;font-size:10px}
.g-head .g-lab{background:var(--navy);color:#fff;font-weight:600;font-size:11px}
.g-head .g-tr{height:34px}
.g-head .wk{position:absolute;top:16px;font-size:9.5px;transform:translateX(3px);color:#B9C7DC;font-variant-numeric:tabular-nums}
.g-head .mo{position:absolute;top:3px;font-weight:700;transform:translateX(3px);color:#fff}
.g-head .wk.now{color:var(--today);font-weight:700}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:14px;height:8px;border-radius:2px;margin-right:5px;vertical-align:1px}
.empty{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px;text-align:center;color:var(--muted)}
footer{max-width:1080px;margin:28px auto 0;font-size:12px;color:var(--muted);display:flex;gap:8px 16px;flex-wrap:wrap;justify-content:space-between}
footer a{color:var(--accent)}
@media (max-width:820px){
  .tiles{grid-template-columns:1fr 1fr} .tile b{font-size:18px}
  .tablecard{display:none} .cards{display:grid}
  .g-row{grid-template-columns:130px minmax(0,1fr)}
}
@media print{ .hero{-webkit-print-color-adjust:exact;print-color-adjust:exact} .gantt{overflow:visible} body{background:#fff} }
</style>

<body>
<div class="hero"><div class="wrap">
  <div class="eyebrow">Ход работ по объекту</div>
  <h1 id="h1">Загружаю…</h1>
  <div class="meta" id="meta"></div>
</div></div>
<main><div class="wrap" id="view"></div>
<footer><span id="upd"></span><span>Страница только для просмотра. Сформирована в <a href="/" rel="noopener">PROJECT CONTROL PRO</a></span></footer>
</main>
<script>
/* PROJECT CONTROL PRO — расчётное ядро (повторяет формулы Excel-версии). Даты — номера дней (UTC). */
const DAY = 86400000;
function dn(s) { if (s === null || s === undefined || s === "") return null; if (typeof s === "number") return s; const [y, m, d] = String(s).slice(0, 10).split("-").map(Number); if (!y || !m || !d) return null; return Math.round(Date.UTC(y, m - 1, d) / DAY); }
function ds(n) { if (n === null || n === undefined) return ""; const t = new Date(n * DAY); return t.toISOString().slice(0, 10); }
function wd2(n) { return ((n + 3) % 7 + 7) % 7 + 1; } // ПН=1
function num(v) { return (v === null || v === undefined || v === "" || isNaN(+v)) ? 0 : +v; }
function blank(v) { return v === null || v === undefined || v === ""; }
function vatRate(v) { return (blank(v) || v === "Без НДС") ? 0 : +v; }
function todayN() { const t = new Date(); return Math.round(Date.UTC(t.getFullYear(), t.getMonth(), t.getDate()) / DAY); }

function compute(S) {
  const st = S.settings;
  const rep = blank(st.repDate) ? todayN() : dn(st.repDate);
  const startD = blank(st.startDate) ? dn("2000-01-01") : dn(st.startDate);
  const target = num(st.target), crit = num(st.crit), tax = num(st.tax), hz = num(st.horizon), lag = num(st.lagTol);
  const gs = blank(st.ganttStart) ? rep - wd2(rep) + 1 - 28 : dn(st.ganttStart) - wd2(dn(st.ganttStart)) + 1;
  const R = { repN: rep, startD, gantt: gs };   // repN — отчётная дата номером дня (R.rep занят заменами)
  const prjBy = {}; S.projects.forEach(p => { if (p.code) prjBy[p.code] = p; });
  const objOf = c => blank(c) ? "" : (prjBy[c] ? prjBy[c].name : "код не найден");

  // ---------- Платежи
  R.pay = S.payments.map(p => {
    const o = {};
    if (blank(p.type)) return o;
    const a = dn(p.date), j = dn(p.fdate);
    o.obj = blank(p.proj) ? "Общие расходы компании" : objOf(p.proj);
    if (p.status === "Отменено") o.ctrl = "Отменено";
    else if (p.status === "Оплачено") o.ctrl = j === null ? "Укажите дату" : (p.type === "Расход" && !blank(p.proj) && blank(p.art) ? "Укажите статью" : "Оплачено");
    else o.ctrl = a === null ? "Укажите срок" : a < rep ? "Просрочено" : a - rep <= hz ? "Скоро срок" : "Ожидается";
    if (p.status === "Отменено") o.dds = null;
    else if (p.status === "Оплачено") o.dds = j === null ? a : j;
    else o.dds = a === null ? null : Math.max(a, rep);
    o.days = (a !== null && p.status === "План") ? a - rep : null;
    return o;
  });
  const paid = (fn) => S.payments.reduce((s, p, i) => s + (p.status === "Оплачено" && fn(p, i) ? num(p.amt) : 0), 0);

  // ---------- Бюджет
  const cnt = {}; S.budget.forEach(b => { if (!blank(b.proj)) { const k = b.proj + "|" + b.art; cnt[k] = (cnt[k] || 0) + 1; } });
  R.bud = S.budget.map(b => {
    if (blank(b.proj)) return {};
    const o = { obj: objOf(b.proj) };
    o.paid = blank(b.art) ? 0 : paid(p => p.proj === b.proj && p.art === b.art && p.type === "Расход");
    o.fact = o.paid + num(b.korr);
    o.left = blank(b.own) ? Math.max(0, num(b.plan) - o.fact) : num(b.own);
    o.fc = o.fact + o.left; o.dev = o.fc - num(b.plan);
    o.osv = num(b.plan) === 0 ? 0 : o.fact / num(b.plan);
    o.st = cnt[b.proj + "|" + b.art] > 1 ? "Дубль статьи" : o.dev > 0 ? "Перерасход" : o.dev < 0 ? "Экономия" : "В бюджете";
    return o;
  });
  R.svod = (proj) => {
    const rows = S.lists.cost.map(art => {
      let plan = 0, fact = 0, fc = 0;
      S.budget.forEach((b, i) => { if (b.art === art && !blank(b.proj) && (!proj || b.proj === proj)) { plan += num(b.plan); fact += R.bud[i].fact; fc += R.bud[i].fc; } });
      const dev = fc - plan;
      return { art, plan, fact, fc, dev, st: plan === 0 ? "" : dev > 0 ? "Перерасход" : dev < 0 ? "Экономия" : "В бюджете" };
    });
    return rows;
  };
  R.outOfBudget = paid(p => p.type === "Расход" && !blank(p.proj)) - R.bud.reduce((s, o) => s + num(o.paid), 0);

  // ---------- График работ (детально) — база
  const wById = {}; S.works.forEach((w, i) => { if (w.id) wById[w.id] = i; });
  R.work = S.works.map(w => {
    if (blank(w.id)) return {};
    const o = {};
    const ps = dn(w.ps), pf = dn(w.pf), fs = dn(w.fs), ff = dn(w.ff);
    o.prog = blank(w.vol) ? null : (num(w.vol) === 0 ? 0 : Math.min(1, num(w.done) / num(w.vol)));
    const pr = num(o.prog);
    o.shift = ps === null ? null : fs !== null ? fs - ps : (pr < 1 && ps < rep ? rep - ps : 0);
    o.fc = pf === null ? null : ff !== null ? ff : pr >= 1 ? pf : pf + Math.max(0, num(o.shift));
    const plan = (ps === null || pf === null) ? 0 : Math.max(0, Math.min(1, (rep - num(ps) + 1) / (pf - num(ps) + 1)));
    if (pr >= 1) o.st = (ff !== null && ff > pf) ? "Сдано с опозданием" : "Готово";
    else if (fs === null) o.st = num(ps) < rep ? "Старт сорван" : "Не начато";
    else if (pf !== null && pf < rep) o.st = "Просрочено";
    else o.st = (plan - pr > lag || num(o.fc) - num(pf) > 3) ? "Отставание" : "В работе";
    o.plan = plan;
    return o;
  });
  const workStart = id => (blank(id) || wById[id] === undefined) ? null : dn(S.works[wById[id]].ps);

  // ---------- Замены
  R.rep = S.repl.map(z => {
    if (blank(z.id)) return {};
    const o = { obj: objOf(z.proj) };
    o.diff = (blank(z.p1) || blank(z.p2)) ? null : (num(z.p2) - num(z.p1)) * (blank(z.qty) ? 1 : num(z.qty));
    o.ws = blank(z.work) ? null : workStart(z.work);
    const due = dn(z.due);
    if (z.status === "Согласовано") o.ctrl = blank(z.ans) ? "Укажите дату" : "Согласовано";
    else if (z.status === "Отказ") o.ctrl = "Отказ";
    else if (z.status === "Отозвано") o.ctrl = "Отменено";
    else if (blank(z.status) || z.status === "Подготовка") o.ctrl = (o.ws !== null && o.ws - rep <= 21) ? "Срочно направить" : "Подготовка";
    else if (due !== null && due < rep) o.ctrl = "Ответ просрочен";
    else if (o.ws !== null && o.ws - rep <= 14) o.ctrl = "Риск для монтажа";
    else o.ctrl = "Ждём ответа";
    return o;
  });
  const repCtrl = id => { const i = S.repl.findIndex(z => z.id === id); return i < 0 ? "" : R.rep[i].ctrl; };

  // ---------- Закупки
  R.buy = S.purchases.map(b => {
    if (blank(b.proj)) return {};
    const o = { obj: objOf(b.proj) };
    o.cost = num(b.qty) * num(b.price);
    o.ws = workStart(b.work);
    const K = dn(b.fc);
    o.res = (o.ws === null || K === null) ? null : o.ws - K;
    o.rs = blank(b.repl) ? "" : repCtrl(b.repl);
    const base = () => K === null ? "Укажите срок" : K < rep ? "Задержка" : blank(b.work) ? "Нет связи с работой" : o.ws === null ? "Работа не найдена" : K > o.ws ? "Срыв монтажа" : o.res <= 3 ? "Впритык" : "В срок";
    if (b.status === "Отменено") o.ctrl = "Отменено";
    else if (b.status === "Получено") o.ctrl = "Получено";
    else if (blank(b.repl)) o.ctrl = base();
    else if (o.rs === "Отказ") o.ctrl = "Отказ в замене";
    else if (o.rs === "") o.ctrl = "Замена не найдена";
    else if (o.rs === "Согласовано") o.ctrl = base();
    else o.ctrl = "Ждёт согласования";
    return o;
  });

  // оборудование для работы
  S.works.forEach((w, i) => {
    if (blank(w.id)) return;
    const bi = S.purchases.map((b, k) => k).filter(k => S.purchases[k].work === w.id);
    const ri = S.repl.map((z, k) => k).filter(k => S.repl[k].work === w.id);
    const risk = bi.some(k => ["Срыв монтажа", "Задержка", "Отказ в замене"].includes(R.buy[k].ctrl)) || ri.some(k => ["Ответ просрочен", "Риск для монтажа"].includes(R.rep[k].ctrl));
    const wait = ri.some(k => ["Ждём ответа", "Подготовка", "Срочно направить"].includes(R.rep[k].ctrl));
    R.work[i].equip = risk ? "Риск поставки" : wait ? "Ждёт замены" : bi.length === 0 ? "—" : bi.every(k => ["Получено", "Отменено"].includes(S.purchases[k].status)) ? "Получено" : "Ожидается";
  });

  // ---------- ППР (этапы)
  const stById = {}; S.stages.forEach((s, i) => { if (s.id) stById[s.id] = i; });
  R.stage = S.stages.map(s => {
    if (blank(s.id)) return {};
    const o = { obj: objOf(s.proj) };
    const idx = S.works.map((w, k) => k).filter(k => S.works[k].sid === s.id);
    o.nw = idx.length;
    const ps = dn(s.ps), pf = dn(s.pf);
    if (o.nw === 0) { o.fs = dn(s.fs); o.ff = dn(s.ff); o.prog = num(s.prog); }
    else {
      const fss = idx.map(k => dn(S.works[k].fs)).filter(x => x !== null);
      o.fs = fss.length ? Math.min(...fss) : null;
      o.ff = idx.some(k => R.work[k].prog !== null && R.work[k].prog < 1) ? null : Math.max(...idx.map(k => num(dn(S.works[k].ff))));
      const pr = idx.map(k => R.work[k].prog).filter(x => x !== null);
      o.prog = pr.length ? pr.reduce((a, b) => a + b, 0) / pr.length : 0;
    }
    o.plan = (ps === null || pf === null) ? null : Math.max(0, Math.min(1, (rep - ps + 1) / (pf - ps + 1)));
    o.shift = ps === null ? null : o.fs !== null ? o.fs - ps : (o.prog < 1 && ps < rep ? rep - ps : 0);
    if (pf === null) o.fc = null;
    else if (o.ff !== null) o.fc = o.ff;
    else if (o.prog >= 1) o.fc = pf;
    else o.fc = Math.max(pf + Math.max(0, num(o.shift)), o.nw === 0 ? 0 : Math.max(...idx.map(k => num(R.work[k].fc))));
    if (o.prog >= 1) o.st = (o.ff !== null && o.ff > pf) ? "Сдано с опозданием" : "Готово";
    else if (o.fs === null) o.st = num(ps) < rep ? "Старт сорван" : "Не начато";
    else if (pf < rep) o.st = "Просрочено";
    else o.st = (num(o.plan) - o.prog > lag || o.fc - pf > 3) ? "Отставание" : "В работе";
    return o;
  });
  S.works.forEach((w, i) => { if (!blank(w.id)) R.work[i].obj = objOf(w.proj); R.work[i].sname = blank(w.sid) ? "" : (stById[w.sid] === undefined ? "этап не найден" : S.stages[stById[w.sid]].stage); R.work[i].badStage = !blank(w.sid) && (stById[w.sid] === undefined || S.stages[stById[w.sid]].proj !== w.proj); });

          if(r.fc!==null && r.fc > b0 && dn1 < 1){ const t = Math.min(100, x(r.fc+1)); if(t > b) h += `<span class="g-tail" style="left:${b}%;width:${t-b}%" title="Прогноз финиша: ${fdate(r.fc)}"></span>`; } } }
      h += `</div></div>`; });
    h += `</div></div><div class="legend"><span><i style="background:var(--barDone)"></i>выполнено</span><span><i style="background:var(--bar)"></i>осталось по плану</span><span><i style="background:var(--barLag)"></i>отставание</span><span><i style="background:var(--barBad)"></i>просрочено</span><span><i style="background:repeating-linear-gradient(90deg,var(--barBad) 0 4px,transparent 4px 7px)"></i>прогноз позже плана</span><span><i style="background:var(--todaySoft);border:1px solid var(--today)"></i>текущая неделя</span></div>`;
  }
  view.innerHTML = h;
}
const token = new URLSearchParams(location.search).get("t") || "";
function fail(msg){ document.getElementById("h1").textContent = "Ссылка не открывается"; document.getElementById("meta").innerHTML = ""; document.getElementById("view").innerHTML = `<div class="empty">${esc(msg)}</div>`; }
async function loadShare(first){
  try{
    const r = await fetch("/api/share?t=" + encodeURIComponent(token), {headers:{"X-PCP":"1"}}); const j = await r.json().catch(() => ({}));
    if(!r.ok){ if(first || r.status===404) fail(j.error || "Не удалось загрузить данные. Попробуйте обновить страницу."); return; }
    show(j);
  }catch(e){ if(first) fail("Нет связи с сервером. Проверьте интернет и обновите страницу."); }
}
if(!token) fail("В ссылке не хватает кода. Попросите подрядчика прислать её ещё раз.");
else { loadShare(true); setInterval(() => { if(!document.hidden) loadShare(false); }, 5*60*1000); }
</script>
