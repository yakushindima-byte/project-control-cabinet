/* Макет: тёмно-синяя панель листов слева (как ярлыки книги Excel) + рабочая область; белые поля — ввод, голубые — расчёт */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --ink:#0F1B2D; --muted:#5B6A80; --line:#DCE2EA; --line2:#E9EDF3;
  --navy:#0B1F3A; --navy2:#12305A; --navyInk:#DCE8FA; --navyMuted:#8FA6C6;
  --accent:#1565C0; --accentSoft:#DCEAFB; --accentInk:#FFFFFF;
  --calc:#EEF3FA; --calcInk:#334155; --inputBg:#FFFFFF; --inputLine:#C9D3E0; --focus:#1565C0;
  --good:#D7F2DD; --goodInk:#11652B; --warn:#FFF0C2; --warnInk:#8A5A00; --bad:#FBD3D6; --badInk:#A0101C;
  --info:#DCEAFB; --infoInk:#15457A; --neutral:#E7EAEE; --neutralInk:#4B5563;
  --bar:#A9CBF2; --barDone:#1565C0; --barBad:#E57373; --barLag:#FFB74D; --barEq:#F48FB1; --today:#F2B705; --todaySoft:#FFF3C4;
  --cGreen:#2E7D32; --cOrange:#EF6C00; --cPurple:#6A1B9A; --cRed:#C62828;
  --shadow:0 1px 2px rgba(11,31,58,.06),0 4px 14px rgba(11,31,58,.05);
  --f-ui:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-disp:"Unbounded","Golos Text",system-ui,sans-serif;
  --fs-xs:11px; --fs-s:12.5px; --fs-m:14px; --fs-l:18px; --fs-xl:24px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0A111D; --surface:#111A2A; --ink:#E6ECF5; --muted:#8C9AB0; --line:#22314A; --line2:#1A2639;
  --navy:#060C17; --navy2:#0D1A2E; --navyInk:#DCE8FA; --navyMuted:#7D93B3;
  --accent:#5B9BEF; --accentSoft:#173052; --accentInk:#06101F;
  --calc:#152238; --calcInk:#C3D0E2; --inputBg:#0E1624; --inputLine:#2B3B56; --focus:#5B9BEF;
  --good:#123A22; --goodInk:#7EE0A0; --warn:#3B2F0E; --warnInk:#F5C95A; --bad:#46161C; --badInk:#FF9AA4;
  --info:#152E50; --infoInk:#9CC3FF; --neutral:#202B3B; --neutralInk:#AAB5C5;
  --bar:#2C4C78; --barDone:#5B9BEF; --barBad:#C65757; --barLag:#D68A2C; --barEq:#C2668C; --today:#F2B705; --todaySoft:#3A3110;
  --cGreen:#5BBF6A; --cOrange:#F08A3A; --cPurple:#B37FE0; --cRed:#F06A6A;

  --calc:#152238; --calcInk:#C3D0E2; --inputBg:#0E1624; --inputLine:#2B3B56; --focus:#5B9BEF;

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:var(--fs-m);line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:50;background:var(--navy)}
button,input,select{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.num,td.n,.tile b{font-variant-numeric:tabular-nums}

.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
/* ---------- панель листов */
.side{align-self:start;background:var(--navy);color:var(--navyInk);position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));overflow:auto;display:flex;flex-direction:column;padding:18px 12px 16px max(12px,env(safe-area-inset-left,0px))}
.logo{font-family:var(--f-disp);font-weight:700;font-size:15px;letter-spacing:.3px;line-height:1.15;padding:0 8px;color:#fff}
.logo span{color:#6FA8FF}
.company{font-size:var(--fs-xs);color:var(--navyMuted);padding:4px 8px 14px}
.grp{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--navyMuted);padding:12px 8px 4px;font-weight:600}
.nav a{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:6px;color:var(--navyInk);text-decoration:none;font-size:13.5px;font-weight:500}
.nav a:hover{background:rgba(255,255,255,.06)}
.nav a.on{background:var(--navy2);color:#fff;box-shadow:inset 0 0 0 1px rgba(111,168,255,.25)}
.nav i{width:9px;height:9px;border-radius:2px;flex:none}
.nav .cnt{margin-left:auto;font-size:10.5px;font-weight:700;background:#C62828;color:#fff;border-radius:9px;padding:0 6px;line-height:17px}
.sidecta{margin-top:auto;padding:14px 10px 4px}
.sidecta .box{border:1px solid rgba(111,168,255,.28);border-radius:10px;padding:12px;background:rgba(21,101,192,.12)}
.sidecta p{margin:0 0 10px;font-size:12px;color:var(--navyMuted);line-height:1.4}
.sidecta b{color:#fff;display:block;font-size:13px;margin-bottom:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:7px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:#1565C0;border-color:#1565C0;color:#fff}
.btn.pri:hover{background:#0F57AA}
.btn.ghost{background:transparent}
.btn.sm{padding:3px 9px;font-size:12px}
.btn.wide{width:100%}

/* ---------- верх */
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);padding-block:12px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.top h1{font-family:var(--f-disp);font-weight:600;font-size:19px;margin:0;letter-spacing:.2px;text-wrap:balance}
.top .sub{color:var(--muted);font-size:12.5px;margin-top:2px;max-width:780px}
.top .tt{min-width:0;flex:1 1 380px}
.top .ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.repdate{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:7px;padding:3px 4px 3px 9px}
.repdate input{border:0;background:transparent;font-weight:700;color:var(--badInk);font-size:13px;padding:2px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--warnInk);background:var(--warn);border-radius:5px;padding:3px 7px}
.mnav{display:none}
.content{padding-block:20px 48px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px;min-width:0}
.sec-h{font-size:11px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;color:var(--accent);margin:0 0 10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sec-h.red{color:var(--cRed)}
.sec-h .rt{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:500;color:var(--muted);font-size:12px}

/* ---------- плитки */
.tiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--tc,var(--accent));border-radius:8px;padding:10px 12px 11px;min-width:0;text-align:left;cursor:default}
button.tile{cursor:pointer;font:inherit;color:inherit;width:100%}
button.tile:hover{border-color:var(--tc);box-shadow:var(--shadow)}
.tile small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.5px;color:var(--muted);text-transform:uppercase}
.tile b{display:block;font-size:21px;font-weight:700;color:var(--ink);margin:3px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile b.alarm{color:var(--cRed)}
.tile span{font-size:11.5px;color:var(--muted);display:block}

.try{display:grid;grid-template-columns:auto repeat(3,minmax(0,1fr));gap:10px;align-items:stretch;background:var(--accentSoft);border-radius:10px;padding:12px}
.try .lbl{font-family:var(--f-disp);font-size:13px;font-weight:600;color:var(--accent);align-self:center;padding:0 8px;line-height:1.25}
.try a{display:block;background:var(--surface);border-radius:8px;padding:9px 11px;text-decoration:none;color:var(--ink);font-size:12.5px;line-height:1.35;border:1px solid transparent}
.try a:hover{border-color:var(--accent)}
.try a em{font-style:normal;font-weight:700;color:var(--accent);display:block;font-size:11px;margin-bottom:2px;letter-spacing:.3px}

.grid2{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.chartbox{position:relative;height:260px}

/* ---------- таблицы */
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.tools select,.tools input[type=search]{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:5px 8px;font-size:13px;max-width:100%}
.tools .legend{margin-left:auto;font-size:11.5px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border:1px solid var(--inputLine);border-radius:2px;vertical-align:-2px;margin-right:4px}
.legend i.c{background:var(--calc);border-color:var(--line)}
.tw{overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface);max-height:72vh}
table.t{border-collapse:separate;border-spacing:0;font-size:var(--fs-s);table-layout:fixed}
.t th{position:sticky;top:0;z-index:2;overflow-wrap:anywhere;background:var(--navy);color:#fff;font-weight:600;font-size:11px;line-height:1.2;padding:7px 6px;text-align:center;vertical-align:middle;border-right:1px solid rgba(255,255,255,.08);white-space:normal}
.t th.c{background:#3D6A99}
.t td{border-bottom:1px solid var(--line2);border-right:1px solid var(--line2);padding:0 6px;height:30px;white-space:nowrap;vertical-align:middle;overflow:hidden;text-overflow:ellipsis}
.t td.c{background:var(--calc);color:var(--calcInk)}
.t td.n{text-align:right}
.t td.ctr{text-align:center}
.t td.e{padding:0}
.t tr.sub td{background:var(--surface);font-weight:700;color:var(--accent);border-bottom:2px solid var(--accent);position:sticky;top:var(--hh,34px);z-index:1}
.t tr.tot td{background:var(--navy);color:#fff;font-weight:700}
.t .stk{position:sticky;left:0;z-index:1}
.t th.stk{z-index:3}
.t td.stk{background:var(--surface)}
.t td.stk.c{background:var(--calc)}
.t tbody tr:hover td{box-shadow:inset 0 0 0 9999px rgba(21,101,192,.04)}
.t input,.t select{border:0;background:transparent;height:30px;width:100%;padding:0 6px;font-size:var(--fs-s);min-width:0}
.t input:hover,.t select:hover{background:var(--accentSoft)}
.t input:focus,.t select:focus{background:var(--inputBg);outline:2px solid var(--focus);outline-offset:-2px}
.t input.n{text-align:right}
.t input[disabled]{color:var(--muted);background:var(--neutral)}
.t .del{border:0;background:none;color:var(--muted);cursor:pointer;width:26px;height:28px;font-size:15px}
.t .del:hover{color:var(--cRed)}
.addrow{margin-top:8px}
.neg{color:var(--badInk);font-weight:600}
.pos{color:var(--goodInk);font-weight:600}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;white-space:nowrap;line-height:1.5}
.p-g{background:var(--good);color:var(--goodInk)} .p-w{background:var(--warn);color:var(--warnInk)} .p-b{background:var(--bad);color:var(--badInk)} .p-i{background:var(--info);color:var(--infoInk)} .p-n{background:var(--neutral);color:var(--neutralInk)}
.mbar{display:flex;align-items:center;gap:6px;justify-content:flex-end}
.mbar u{display:block;width:44px;height:6px;border-radius:3px;background:var(--line);overflow:hidden;text-decoration:none}
.mbar u s{display:block;height:100%;background:var(--cGreen);text-decoration:none}
.note{font-size:12px;color:var(--muted);margin:6px 2px 0}

/* ---------- Гант */
.gantt{overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.g-in{min-width:880px;position:relative}
.g-row{display:grid;grid-template-columns:240px minmax(0,1fr);border-bottom:1px solid var(--line2);min-height:28px}
.g-row:last-child{border-bottom:0}
.g-lab{padding:5px 10px;font-size:12px;line-height:1.25;border-right:1px solid var(--line);position:sticky;left:0;background:var(--surface);z-index:2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-lab small{color:var(--muted);margin-right:6px;font-variant-numeric:tabular-nums}
.g-tr{position:relative}
.g-wk{position:absolute;top:0;bottom:0;border-left:1px solid var(--line2)}
.g-now{position:absolute;top:0;bottom:0;background:var(--todaySoft);z-index:0}
.g-bar{position:absolute;top:7px;height:14px;border-radius:3px;background:var(--bar);overflow:hidden;z-index:1}
.g-bar s{display:block;height:100%;background:var(--barDone)}
.g-bar.bad{background:var(--barBad)} .g-bar.bad s{background:transparent}
.g-bar.lag{background:var(--barLag)}
.g-bar.eq{background:var(--barEq)}
.g-head{position:sticky;top:0;z-index:3;background:var(--navy);color:#fff;font-size:10px}
.g-head .g-lab{background:var(--navy);color:#fff;font-weight:600;font-size:11px}
.g-head .g-tr{height:34px}
.g-head .wk{position:absolute;top:16px;font-size:9.5px;transform:translateX(3px);color:#B9C7DC;font-variant-numeric:tabular-nums}
.g-head .mo{position:absolute;top:3px;font-weight:700;transform:translateX(3px);color:#fff}
.g-head .wk.now{color:var(--today);font-weight:700}
.g-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:8px}
.g-legend i{display:inline-block;width:14px;height:8px;border-radius:2px;margin-right:5px;vertical-align:1px}

/* ---------- формы (КП, настройки) */
.kp{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
.form{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px 14px}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label{font-size:11.5px;color:var(--muted);font-weight:500}
.fld input,.fld select{border:1px solid var(--inputLine);background:var(--inputBg);border-radius:6px;padding:6px 8px;font-size:13.5px;min-width:0;width:100%}
.fld input.hl{background:#FFF8DC;color:#0B1F3A;font-weight:700}
:root[data-theme="dark"] .fld input.hl{background:#2B2610;color:#F5E6B8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .fld input.hl{background:#2B2610;color:#F5E6B8}}
.fld output{display:block;background:var(--calc);color:var(--calcInk);border-radius:6px;padding:6px 8px;font-size:13.5px;font-weight:600;font-variant-numeric:tabular-nums}
.res{position:sticky;top:96px;display:flex;flex-direction:column;gap:10px}
.res .card{padding:0;overflow:hidden}
.res .dec{padding:16px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--line)}
.res .dec small{font-size:10.5px;font-weight:700;letter-spacing:1px;color:var(--muted);text-transform:uppercase}
.res .dec .big{font-family:var(--f-disp);font-size:26px;font-weight:700}
.res .dec.g .big{color:var(--goodInk)} .res .dec.w .big{color:var(--warnInk)} .res .dec.b .big{color:var(--badInk)}
.res .dec.g{background:var(--good)} .res .dec.w{background:var(--warn)} .res .dec.b{background:var(--bad)}
.meter{position:relative;height:10px;border-radius:5px;background:var(--line);margin:10px 0 4px}
.meter .ok{position:absolute;left:0;top:0;bottom:0;background:var(--cGreen);opacity:.35;border-radius:5px}
.meter .me{position:absolute;top:-4px;width:3px;height:18px;background:var(--ink);border-radius:2px}
.meter-l{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.rl{display:flex;justify-content:space-between;gap:10px;padding:6px 16px;font-size:13px;border-bottom:1px solid var(--line2)}
.rl:last-child{border-bottom:0}
.rl b{font-variant-numeric:tabular-nums}
.rl.strong{font-weight:700;background:var(--calc)}
.blk h3{font-size:13px;margin:0 0 8px;color:var(--accent);font-weight:700}

.lists{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.lists .card h3{margin:0 0 8px;font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.lists ul{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:5px}
.lists li{font-size:12px;background:var(--calc);border-radius:5px;padding:2px 7px}

/* ---------- витрина Excel */
.buy{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px}
.buy h2{font-family:var(--f-disp);font-size:26px;line-height:1.15;margin:0 0 10px;text-wrap:balance}
.buy p{max-width:62ch;color:var(--muted)}
.buy ul.k{padding:0;margin:14px 0;list-style:none;display:grid;gap:8px}
.buy ul.k li{display:grid;grid-template-columns:22px 1fr;gap:6px;font-size:14px}
.buy ul.k li::before{content:"✓";color:var(--cGreen);font-weight:800}
.sheetlist{display:grid;gap:6px}
.sheetlist a{display:flex;gap:10px;align-items:baseline;text-decoration:none;color:var(--ink);font-size:13px;padding:7px 10px;border-radius:7px;border:1px solid var(--line);background:var(--surface)}
.sheetlist a:hover{border-color:var(--accent)}
.sheetlist a i{width:9px;height:9px;border-radius:2px;flex:none;align-self:center}
.sheetlist a span{color:var(--muted);font-size:12px}

.banner{background:var(--warn);color:var(--warnInk);border-radius:10px;padding:12px 14px;font-size:13.5px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner b{font-weight:700}
.start{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.start a{display:block;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;text-decoration:none;color:var(--ink);font-size:12.5px;line-height:1.35}
.start a:hover{border-color:var(--accent)}
.start a em{font-style:normal;font-weight:700;color:var(--accent);display:block;font-size:11px;margin-bottom:2px;letter-spacing:.3px}
.inl{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.inl input{border:1px solid var(--inputLine);background:var(--inputBg);border-radius:6px;padding:6px 8px;font-size:13.5px;min-width:0;flex:1 1 200px;max-width:340px}
.linkbox{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;background:var(--calc);border-radius:6px;padding:7px 9px;word-break:break-all;user-select:all}
.lists li button{border:0;background:none;color:var(--muted);cursor:pointer;padding:0 0 0 4px;font-size:13px;line-height:1}
.lists li button:hover{color:var(--cRed)}
.lists form{display:flex;gap:6px;margin-top:8px}
.lists form input{flex:1;min-width:0;border:1px solid var(--inputLine);background:var(--inputBg);border-radius:5px;padding:3px 7px;font-size:12px}
.toast{position:fixed;right:max(18px,env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--navy);color:#fff;font-size:13px;padding:9px 14px;border-radius:8px;box-shadow:var(--shadow);opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;z-index:60}
.toast.on{opacity:1;transform:none}
.confirm{display:inline-flex;gap:6px;align-items:center;font-size:12px}

@media (max-width:1250px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))} .kp{grid-template-columns:1fr} .res{position:static}}
@media (max-width:900px){
  .start{grid-template-columns:1fr 1fr}
  .app{grid-template-columns:1fr}
  .side{display:none}
  .mnav{display:flex;gap:6px;overflow-x:auto;width:100%;padding-bottom:2px;scrollbar-width:none}
  .mnav a{flex:none;font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:14px;background:var(--calc);color:var(--ink);text-decoration:none}
  .mnav a.on{background:#1565C0;color:#fff}
  .top{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));gap:10px}
  .content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .grid2,.buy{grid-template-columns:1fr}
  .try{grid-template-columns:1fr}
  .top .sub{display:none}
  .g-row{grid-template-columns:150px minmax(0,1fr)}
  .form{grid-template-columns:1fr}
}
@media (max-width:520px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))} .tile b{font-size:17px} .top h1{font-size:16px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <aside class="side" id="side"></aside>
  <div class="main">
    <header class="top">
      <div class="tt"><h1 id="h1"></h1><div class="sub" id="hsub"></div></div>
      <div class="ctrl">
        <span class="chip" id="demochip" title="Пример компании с 8 объектами">Демо-данные</span>
        <label class="repdate" for="repdate">Дата отчёта <input type="date" id="repdate"></label>
        <span id="resetbox"><button class="btn sm ghost" id="reset" type="button">Сбросить демо</button></span>
        <a class="btn sm" id="loginTop" href="/login.html" hidden>Войти в кабинет</a>
        <a class="btn sm pri" id="buyTop" href="/login.html#buy">Купить</a>
        <button class="btn sm ghost" id="logout" type="button" hidden>Выйти</button>
      </div>
      <nav class="mnav" id="mnav"></nav>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

async function api(method, url, body){
  const r = await fetch(url, {method, credentials:"same-origin", headers:{"Content-Type":"application/json","X-PCP":"1"}, body: body ? JSON.stringify(body) : undefined});
  let j = {}; try{ j = await r.json(); }catch(e){}
  if(r.status===401 && !url.includes("/login")){ location.href = "/login.html"; throw new Error(j.error || "Войдите в кабинет"); }
  if(!r.ok) throw new Error(j.error || ("Ошибка " + r.status));
  return j;
}
let queue = [], sending = false;
function send(ops){ if(!CAB){ save(); return; } queue.push(...ops); flush(); }
async function flush(){
  if(sending || !queue.length) return;
  sending = true; const ops = queue.splice(0);
  try{ const r = await api("POST","/api/ops",{ops}); const mine = r.prev===VER; VER = r.version; if(!mine) await reload(true); }
  catch(e){ toast(e.message || "Не удалось сохранить"); try{ await reload(true); }catch(_){} }
  sending = false; if(queue.length) flush();
}
async function reload(keep){ const d = await api("GET","/api/data"); S = d.data; VER = d.version; RO = d.readonly; render(keep); }

function cellIn(arr, i, c, v){
  const a = `data-a="${arr}" data-i="${i}" data-k="${c.k}" data-t="${c.t||"text"}"`;
  const dis = RO || (c.dis && c.dis(i)) ? " disabled" : "";
  if(c.t==="sel"){
    const ops = (typeof c.o==="function" ? c.o() : OPTS[c.o]()).slice();
    const has = v===undefined||v===null||v==="" || ops.some(o=>o==v);
    let h = `<select ${a}${dis} aria-label="${esc(c.h)}"><option value=""></option>`;
    if(!has) h += `<option selected>${esc(v)}</option>`;
    ops.forEach(o => h += `<option value="${esc(o)}"${o==v?" selected":""}>${esc(c.o==="vat"?vatL(o):o)}</option>`);
    return h + "</select>";
  }
  if(c.t==="combo") return `<input list="dl-${c.o}" ${a}${dis} value="${esc(v??"")}" placeholder="выберите или введите" aria-label="${esc(c.h)}">`;
  if(c.t==="date") return `<input type="date" ${a}${dis} value="${esc(v||"")}" aria-label="${esc(c.h)}">`;
  if(c.t==="money"||c.t==="num") return `<input class="n" inputmode="decimal" ${a}${dis} value="${v===undefined||v===null||v===""?"":esc(c.t==="money"?nf2.format(v):String(v).replace(".",","))}" aria-label="${esc(c.h)}">`;
  if(c.t==="pct") return `<input class="n" inputmode="decimal" ${a}${dis} value="${v===undefined||v===null||v===""?"":String(+(v*100).toFixed(2)).replace(".",",")}" aria-label="${esc(c.h)}">`;
  return `<input ${a}${dis} value="${esc(v??"")}" aria-label="${esc(c.h)}">`;
}
function fmtCell(c, v){
  if(c.t==="status") return pill(v);
  if(v===null||v===undefined||v==="") return "";
  switch(c.t){
    case "money": return `<span class="${c.sign && v<0 ? "pos" : c.sign && v>0 ? "neg" : (c.neg && v<0 ? "neg" : "")}">${money(v)}</span>`;
    case "int": return `<span class="${c.hot && v>0 ? "neg" : ""}">${v===0?"–":nf0.format(v)}</span>`;
    case "pct": return pct(v, c.d ?? 0);
    case "bar": return `<span class="mbar">${pct(v,0)}<u><s style="width:${Math.max(0,Math.min(1,v))*100}%"></s></u></span>`;
    case "date": return fdate(v);
    case "vat": return vatL(v);
    default: return esc(v);
  }
}
function table(o){
  // o: {arr, rows (S-array), cols, filter(i)->bool, sums:[keys], add:fn, del:true, id}
  const idx = o.rows.map((_,i)=>i).filter(i => !o.filter || o.filter(i));
  if(RO) o = Object.assign({}, o, {del:false, add:false});
  const tw = o.cols.reduce((a,c)=>a+(c.w||80),0) + (o.del?30:0);
  let h = `<div class="tw" data-tw="${o.id}"><table class="t" style="width:max(100%,${tw}px)"><colgroup>${o.del?'<col style="width:30px">':""}${o.cols.map(c=>`<col style="width:${c.w||80}px">`).join("")}</colgroup><thead><tr>`;
  if(o.del) h += `<th class="stk" aria-label="Удалить"></th>`;
  o.cols.forEach((c,j) => h += `<th class="${c.calc?"c":""}${j===0&&!o.del?" stk":""}">${esc(c.h)}</th>`);
  h += `</tr></thead><tbody>`;
  if(o.sums){
    h += `<tr class="sub">${o.del?"<td></td>":""}`;
    o.cols.forEach((c,j) => {
      if(j===0){ h += `<td>Итого: ${idx.length}</td>`; return; }
      if(o.sums.includes(c.k)){ const s = idx.reduce((a,i)=>a+(+((c.calc? c.calc(i) : o.rows[i][c.k])||0)),0); h += `<td class="n">${money(s)}</td>`; }
      else h += "<td></td>";
    });
    h += "</tr>";
  }
  idx.forEach(i => {
    const row = o.rows[i];
    h += "<tr>";
    if(o.del) h += `<td class="stk ctr"><button class="del" data-del="${o.arr}" data-i="${i}" title="Удалить строку" aria-label="Удалить строку">×</button></td>`;
    o.cols.forEach((c,j) => {
      const stk = j===0 && !o.del ? " stk" : "";
      if(c.calc){ const v = c.calc(i); const al = ["money","int","pct","num","bar"].includes(c.t) ? " n" : ["status","date","vat"].includes(c.t)||c.ctr ? " ctr" : ""; h += `<td class="c${al}${stk}">${fmtCell(c, v)}</td>`; }
      else h += `<td class="e${stk}">${cellIn(o.arr, i, c, row[c.k])}</td>`;
    });
    h += "</tr>";
  });
  if(!idx.length) h += `<tr><td colspan="${o.cols.length+(o.del?1:0)}" style="color:var(--muted);padding:14px">${o.rows.length ? "Нет строк по выбранному фильтру" : (RO ? "Пока пусто" : "Пока пусто — нажмите «+ Добавить строку» ниже")}</td></tr>`;
  h += "</tbody></table></div>";
  if(o.add) h += `<button class="btn sm addrow" data-add="${o.arr}" type="button">+ Добавить строку</button>`;
  return h;
}
function projFilter(id, extra=""){
  const v = ui.proj[id] || "";
  let h = `<div class="tools"><select data-ui="proj" data-id="${id}" aria-label="Фильтр по объекту"><option value="">Все объекты</option>`;
  S.projects.filter(p=>p.code).forEach(p => h += `<option value="${esc(p.code)}"${p.code===v?" selected":""}>${esc(p.code)} · ${esc(p.name)}</option>`);
  h += `</select>${extra}<input type="search" data-ui="q" data-id="${id}" placeholder="Поиск" value="${esc(ui.q[id]||"")}" aria-label="Поиск по строкам">`;
  h += `<span class="legend"><span><i></i>ввод</span><span><i class="c"></i>считается само</span></span></div>`;
  return h;
}
function match(id, row, extraTxt=""){
  const p = ui.proj[id]; if(p && row.proj!==p && row.code!==p) return false;
  const q = (ui.q[id]||"").trim().toLowerCase(); if(!q) return true;
  return (Object.values(row).join(" ")+" "+extraTxt).toLowerCase().includes(q);
}
function selFilter(id, key, label, opts){
  const v = ui.f[id+key] || "";
  return `<select data-ui="f" data-id="${id+key}" aria-label="${esc(label)}"><option value="">${esc(label)}: все</option>${opts.map(o=>`<option${o===v?" selected":""}>${esc(o)}</option>`).join("")}</select>`;
}

/* ---------- Гант */
function gantt(rows){
  const G0 = R.gantt, W = 26, span = W*7;
  const x = d => (d - G0) / span * 100;
  let h = `<div class="gantt"><div class="g-in"><div class="g-row g-head"><div class="g-lab">Неделя с понедельника</div><div class="g-tr">`;
  let pm = -1;
  for(let k=0;k<W;k++){
    const d = G0 + k*7, dt = new Date(d*86400000), m = dt.getUTCMonth();
    const now = R.rep>=d && R.rep<d+7;
    if(m!==pm){ h += `<span class="mo" style="left:${x(d)}%">${MON[m]}</span>`; pm=m; }
    h += `<span class="wk${now?" now":""}" style="left:${x(d)}%">${String(dt.getUTCDate()).padStart(2,"0")}</span>`;
  }
  h += `</div></div>`;
  const nowL = x(R.rep - ((R.rep - G0) % 7));
  rows.forEach(r => {
    h += `<div class="g-row"><div class="g-lab" title="${esc(r.label)}"><small>${esc(r.id)}</small>${esc(r.label)}</div><div class="g-tr">`;
    h += `<span class="g-now" style="left:${nowL}%;width:${100/W}%"></span>`;
    for(let k=1;k<W;k++) h += `<span class="g-wk" style="left:${k/W*100}%"></span>`;
    if(r.s!==null && r.e!==null){
      const a = Math.max(0, x(r.s)), b = Math.min(100, x(r.e+1));
      if(b>0 && a<100){
        const cls = ["Просрочено","Старт сорван"].includes(r.st) ? "bad" : r.eq ? "eq" : r.st==="Отставание" ? "lag" : "";
        const fullW = x(r.e+1) - x(r.s), done = Math.max(0, Math.min(1, r.prog||0));
        const doneW = (x(r.s) + fullW*done - a) / (b - a) * 100;
        h += `<span class="g-bar ${cls}" style="left:${a}%;width:${b-a}%" title="${esc(r.label)}: ${fdate(r.s)} – ${fdate(r.e)}, ${pct(done,0)}, ${esc(r.st)}"><s style="width:${Math.max(0,Math.min(100,doneW))}%"></s></span>`;
      }
    }
    h += `</div></div>`;
  });
  h += `</div></div><div class="g-legend"><span><i style="background:var(--barDone)"></i>выполнено</span><span><i style="background:var(--bar)"></i>осталось</span><span><i style="background:var(--barLag)"></i>отставание</span><span><i style="background:var(--barBad)"></i>просрочено / старт сорван</span>${rows.some(r=>r.eq)?'<span><i style="background:var(--barEq)"></i>риск поставки</span>':""}<span><i style="background:var(--todaySoft);border:1px solid var(--today)"></i>неделя отчёта</span></div>`;
  return h;
}

    {h:"Факт, ₽",k:"fact",calc:i=>R.bud[i].fact,t:"money",w:110}, {h:"Своя оценка остатка, ₽ (пусто — авто)",k:"own",t:"money",w:125},

    {h:"Статус",k:"st",calc:i=>R.bud[i].st,t:"status",w:100},
  ];
  const p = ui.proj.budget || "";
  const svod = R.svod(p).filter(r=>r.plan||r.fact||r.fc);
  const tot = svod.reduce((a,r)=>({plan:a.plan+r.plan,fact:a.fact+r.fact,fc:a.fc+r.fc,dev:a.dev+r.dev}),{plan:0,fact:0,fc:0,dev:0});

  svod.forEach(r => h += `<tr><td class="c stk">${esc(r.art)}</td><td class="c n">${money(r.plan)}</td><td class="c n">${money(r.fact)}</td><td class="c n">${money(r.fc)}</td><td class="c n">${fmtCell({t:"money",sign:1}, r.dev)}</td><td class="c ctr">${pill(r.st)}</td></tr>`);
  h += `<tr class="tot"><td class="stk" style="background:var(--navy)">ИТОГО</td><td class="n">${money(tot.plan)}</td><td class="n">${money(tot.fact)}</td><td class="n">${money(tot.fc)}</td><td class="n">${money(tot.dev)}</td><td></td></tr></tbody></table></div>`;
  if(Math.round(R.outOfBudget)!==0) h += `<p class="note neg">Оплаты по объектам вне бюджета: ${rub(R.outOfBudget)} — оплаты с кодом проекта без статьи или со статьёй, которой нет в бюджете объекта.</p>`;
  h += `</section><section>` + projFilter("budget", selFilter("budget","st","Статус",["Перерасход","Экономия","В бюджете","Дубль статьи"])) +
    table({id:"budget", arr:"budget", rows:S.budget, cols, filter:i=>match("budget",S.budget[i]) && (!ui.f.budgetst || R.bud[i].st===ui.f.budgetst), sums:["plan","paid","korr","fact","own","left","fc","dev"], add:1, del:1}) + `</section>`;
  return h;
};

    options:{maintainAspectRatio:false, cutout:"58%", plugins:{legend:{position:"bottom",labels:{boxWidth:12}}}}}));
  const top = R.an.filter(o=>o.code).slice().sort((a,b)=>b.contract-a.contract).slice(0,8);

    {label:"Договор", data:top.map(o=>o.contract), backgroundColor:css("--navy")==="#060C17"?"#3D6A99":css("--navy"), borderRadius:3},

    options:hz ? {indexAxis:"y", maintainAspectRatio:false, plugins:{legend:{position:"bottom",labels:{boxWidth:12}}, tooltip:{callbacks:{label:c=>`${c.dataset.label}: ${rub(c.raw)}`}}}, scales:{y:{grid:{display:false}}, x:{grid:{color:grid}, ticks:{callback:tickM}}}} : {maintainAspectRatio:false, plugins:{legend:{position:"bottom",labels:{boxWidth:12}}, tooltip:tip}, scales:{x:{grid:{display:false}, ticks:{autoSkip:false, maxRotation:0, callback:function(v){ const s=this.getLabelForValue(v); return s.length>16 ? s.split(" ").reduce((a,w)=>{ if((a[a.length-1]+" "+w).trim().length>16) a.push(w); else a[a.length-1]=(a[a.length-1]+" "+w).trim(); return a; },[""]) : s; }}}, y:{grid:{color:grid}, ticks:{callback:tickM}}}}}));
}

let tt; function toast(t){ const el = document.getElementById("toast"); el.textContent = t; el.classList.add("on"); clearTimeout(tt); tt = setTimeout(()=>el.classList.remove("on"), 1600); }
function parseVal(t, v){
  if(t==="money"||t==="num"){ const s = String(v).replace(/[\s ]/g,"").replace(",","."); if(s==="") return ""; const n = parseFloat(s); return isNaN(n) ? "" : n; }
  if(t==="pct"){ const s = String(v).replace(/[\s%]/g,"").replace(",","."); if(s==="") return ""; const n = parseFloat(s); return isNaN(n) ? "" : n/100; }
  if(t==="vat") return v==="Без НДС" ? v : (v===""?"":parseFloat(v));
  return v;
}
function arrOf(path){ return path.split(".").reduce((o,k)=>o==null?undefined:o[k], S); }
function afterEdit(msg){ render(true); toast(msg || (CAB ? "Сохранено" : "Пересчитано")); }
function nextId(arr, key, prefix, pad){ let m = 0; arr.forEach(r => { const x = String(r[key]||""); if(x.startsWith(prefix)){ const n = parseInt(x.slice(prefix.length),10); if(n>m) m = n; } }); return prefix + String(m+1).padStart(pad,"0"); }

let qT; document.addEventListener("input", e => { const el = e.target; if(el.dataset.ui==="q"){ clearTimeout(qT); qT = setTimeout(()=>{ ui.q[el.dataset.id] = el.value; const pos = el.selectionStart; render(true); const n = document.querySelector(`[data-ui="q"][data-id="${el.dataset.id}"]`); if(n){ n.focus(); n.setSelectionRange(pos,pos); } }, 220); } });
document.addEventListener("click", e => {
  const go = e.target.closest("[data-go]");
  if(go){ const [s, f] = go.dataset.go.split(":"); if(f && s==="payments"){ ui.f.paymentsctrl = f; } location.hash = s; return; }
  const add = e.target.closest("[data-add]");
  if(add){ if(RO) return; const path = add.dataset.add, arr = arrOf(path); const row = {_id: rid()};
    const p = Object.entries(ui.proj).find(([k])=>k===cur); const pr = p ? p[1] : "";
    if(path==="payments"){ row.date = S.settings.repDate || ds(todayN()); row.type = "Расход"; row.status = "План"; if(pr) row.proj = pr; }
    else if(path==="budget"||path==="purchases"||path==="repl"||path==="stages"||path==="works"){ if(pr) row.proj = pr; }
    if(path==="repl") row.id = nextId(arr,"id","ЗМ-",3);
    if(path==="stages") row.id = nextId(arr,"id","Э-",2);
    if(path==="works") row.id = nextId(arr,"id","Р-",3);
    if(path==="projects") row.code = nextId(arr,"code","PR-",2);
    if(path==="kp.fot") row.art = "ФОТ";
    if(path.startsWith("kp.blocks.")){ const b = S.kp.blocks[+path.split(".")[2]]; row.vat = b.def_vat; row.art = b.def_art; row.unit = "шт"; }
    if(path==="payments") arr.unshift(row); else arr.push(row);
    send([{t:"add", a:path, row, at: path==="payments" ? "start" : "end"}]); render(true);
    if(path!=="payments"){ const tw = add.previousElementSibling; const tws = document.querySelectorAll(`[data-tw]`); tws.forEach(t=>{ if(t.querySelector(`[data-a="${path}"]`)) t.scrollTop = t.scrollHeight; }); }
    toast("Строка добавлена"); return; }
  const del = e.target.closest("[data-del]");
  if(del){ if(RO) return; const arr = arrOf(del.dataset.del), row = arr[+del.dataset.i]; if(!row) return; arr.splice(+del.dataset.i, 1); send([{t:"del", a:del.dataset.del, id:row._id}]); return afterEdit("Строка удалена"); }
  const ldel = e.target.closest("[data-ldel]");
  if(ldel){ if(RO) return; const L = S.lists[ldel.dataset.ldel], i = L.indexOf(ldel.dataset.v); if(i>=0){ L.splice(i,1); send([{t:"listDel", l:ldel.dataset.ldel, v:ldel.dataset.v}]); afterEdit("Убрано из списка"); } return; }
  if(e.target.id==="logout"){ api("POST","/api/logout").finally(()=>location.href="/login.html"); return; }
  if(e.target.id==="inviteBtn"){ api("POST","/api/team/invite").then(r => { const url = location.origin + "/login.html?invite=" + encodeURIComponent(r.token); document.getElementById("inviteOut").innerHTML = `<p class="note" style="margin:0 0 6px">Отправьте эту ссылку сотруднику — по ней он зарегистрируется в вашем кабинете:</p><div class="inl"><div class="linkbox" style="flex:1 1 300px">${esc(url)}</div><button class="btn sm" type="button" id="copyInvite" data-url="${esc(url)}">Копировать</button></div>`; }).catch(err => toast(err.message)); return; }
  const rn = e.target.closest("[data-renew]");
  if(rn){ rn.disabled = true; api("POST","/api/pay/checkout-renew",{plan:rn.dataset.renew}).then(r => { location.href = r.url; }).catch(err => { rn.disabled = false; toast(err.message); }); return; }
  if(e.target.id==="copyInvite"){ copyText(e.target.dataset.url, e.target); return; }
  const rm = e.target.closest("[data-rm]");
  if(rm){ if(rm.dataset.sure!=="1"){ rm.dataset.sure="1"; rm.textContent = "Точно удалить?"; setTimeout(()=>{ if(rm.isConnected){ rm.dataset.sure=""; rm.textContent="Удалить"; } }, 4000); return; }
    api("DELETE","/api/team/"+rm.dataset.rm).then(()=>{ toast("Сотрудник удалён"); loadTeam(); }).catch(err=>toast(err.message)); return; }
  if(e.target.id==="reset"){ document.getElementById("resetbox").innerHTML = `<span class="confirm">Вернуть исходные демо-данные? <button class="btn sm" id="resetYes" type="button">Да</button><button class="btn sm ghost" id="resetNo" type="button">Нет</button></span>`; return; }
  if(e.target.id==="resetNo"){ document.getElementById("resetbox").innerHTML = `<button class="btn sm ghost" id="reset" type="button">Сбросить демо</button>`; return; }
  if(e.target.id==="resetYes"){ S = clone(DATA); save(); document.getElementById("resetbox").innerHTML = `<button class="btn sm ghost" id="reset" type="button">Сбросить демо</button>`; render(); toast("Демо-данные восстановлены"); return; }
  if(e.target.id==="kpToBudget"){
    if(RO) return;
    const code = nextId(S.projects,"code","PR-",2), clean = o => { Object.keys(o).forEach(k => { if(o[k]===""||o[k]===undefined||o[k]===null) delete o[k]; }); return o; };
    const prj = clean({_id:rid(), code, name:S.kp.obj||"Новый объект", cust:S.kp.cust, stage:"Проектирование", pm:S.lists.pms[0], s:S.kp.s, e:S.kp.e, amt:KP.price, vat:S.kp.vat});
    S.projects.push(prj); const ops = [{t:"add", a:"projects", row:prj, at:"end"}];
    KP.transfer.filter(x=>Math.round(x.v)).forEach(x => { const b = {_id:rid(), proj:code, art:x.art, pos:"Из расчёта КП", plan:Math.round(x.v)}; S.budget.push(b); ops.push({t:"add", a:"budget", row:b, at:"end"}); });
    send(ops); ui.proj.budget = code; location.hash = "budget"; toast(`Создан ${code}: договор и бюджет`); return;
  }
});
function route(){ if(!S) return; const h = location.hash.slice(1);
  if(LOGIN_URL && h==="buy"){ location.replace("/pricing.html"); return; } cur = (V[h] && !(CAB && h==="buy") && !(!CAB && h==="team")) ? h : "dash"; render(); }
window.addEventListener("hashchange", route);
if(window.matchMedia) window.matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", ()=>drawCharts());
new MutationObserver(()=>drawCharts()).observe(document.documentElement, {attributes:true, attributeFilter:["data-theme"]});
document.documentElement.lang = "ru";
async function boot(){
  if(!CAB){
    ensureIds();
    if(LOGIN_URL){ const l = document.getElementById("loginTop"); l.href = LOGIN_URL; l.hidden = false; const b = document.getElementById("buyTop"); b.href = "/login.html#buy"; b.textContent = "Купить"; }
    route(); return;
  }
  ["demochip","resetbox","buyTop"].forEach(id => { const el = document.getElementById(id); if(el) el.remove(); });
  document.getElementById("logout").hidden = false;
  try{
    ME = await api("GET","/api/me");
    const d = await api("GET","/api/data"); S = d.data; VER = d.version; RO = d.readonly;
    try{ PAY = await api("GET","/api/pay/plans"); }catch(e){}
  }catch(e){ document.getElementById("view").innerHTML = `<div class="banner">${esc(e.message)}</div>`; return; }
  route();
  setInterval(poll, 15000);
  document.addEventListener("visibilitychange", () => { if(!document.hidden) poll(); });
}
boot();
</script>

<script>
/* Цели Метрики: buy_click — переход на Boosty, open_buy_page — открыл «Excel-версию», demo_edit — первая правка в демо, kp_calc — правка в Расчёте КП */
(function(){
  function goal(g){ try{ if(window.ym) ym(113824108,'reachGoal',g); }catch(e){} }
  var edited=false, kp=false;
  document.addEventListener('click',function(e){
    var a=e.target.closest&&e.target.closest('a'); if(!a) return;
    if(a.href.indexOf('boosty.to')>-1 || a.href.indexOf('/pricing.html')>-1 || a.href.indexOf('/login.html#buy')>-1) goal('buy_click');
    else if(a.getAttribute('href')==='#buy') goal('open_buy_page');
  },true);
  document.addEventListener('change',function(e){
    var d=e.target.dataset||{};
    if(!edited && (d.a||d.st||e.target.id==='repdate')){ edited=true; goal('demo_edit'); }
    if(!kp && d.kp){ kp=true; goal('kp_calc'); if(!edited){ edited=true; goal('demo_edit'); } }
  },true);
})();
</script>
