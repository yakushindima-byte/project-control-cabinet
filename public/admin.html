<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Админка — PROJECT CONTROL PRO</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=Unbounded:wght@600;700&display=swap">
<style>
/* Рабочая панель владельца сервиса: коды доступа сверху, клиенты ниже */
:root{--bg:#F2F4F8;--surface:#fff;--ink:#0F1B2D;--muted:#5B6A80;--line:#DCE2EA;--line2:#E9EDF3;--navy:#0B1F3A;--accent:#1565C0;--calc:#EEF3FA;
  --good:#D7F2DD;--goodInk:#11652B;--warn:#FFF0C2;--warnInk:#8A5A00;--bad:#FBD3D6;--badInk:#A0101C;--neutral:#E7EAEE;--neutralInk:#4B5563;
  --f-ui:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;--f-disp:"Unbounded","Golos Text",system-ui,sans-serif}
@media (prefers-color-scheme: dark){:root{--bg:#0A111D;--surface:#111A2A;--ink:#E6ECF5;--muted:#8C9AB0;--line:#22314A;--line2:#1A2639;--navy:#060C17;--accent:#5B9BEF;--calc:#152238;
  --good:#123A22;--goodInk:#7EE0A0;--warn:#3B2F0E;--warnInk:#F5C95A;--bad:#46161C;--badInk:#FF9AA4;--neutral:#202B3B;--neutralInk:#AAB5C5;color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.45}
header{background:var(--navy);color:#fff;padding-block:14px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header b{font-family:var(--f-disp);font-size:15px;letter-spacing:.3px}
header b span{color:#6FA8FF}
header .r{margin-left:auto;display:flex;gap:8px}
main{padding-block:22px 48px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px;max-width:1400px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
h2{font-size:11px;font-weight:700;letter-spacing:1.3px;text-transform:uppercase;color:var(--accent);margin:0 0 12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
label{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--muted)}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:13.5px;min-width:0}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:7px;padding:6px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:#1565C0;border-color:#1565C0;color:#fff}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.danger{color:var(--badInk)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.tw{overflow:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{background:var(--navy);color:#fff;font-weight:600;font-size:11px;padding:7px 8px;text-align:left;white-space:nowrap;position:sticky;top:0}
td{border-bottom:1px solid var(--line2);padding:6px 8px;vertical-align:middle}
td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.5px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;white-space:nowrap}
.g{background:var(--good);color:var(--goodInk)}.w{background:var(--warn);color:var(--warnInk)}.b{background:var(--bad);color:var(--badInk)}.x{background:var(--neutral);color:var(--neutralInk)}
.muted{color:var(--muted);font-size:12px}
.new{background:var(--calc);border-radius:8px;padding:10px;margin-top:12px}
.new .mono{font-size:15px;font-weight:700}
.users td{background:var(--calc)}
.login{max-width:380px;margin:12vh auto 0}
.toast{position:fixed;right:18px;bottom:18px;background:var(--navy);color:#fff;font-size:13px;padding:9px 14px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none}
.toast.on{opacity:1}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.stat small{display:block;font-size:10.5px;font-weight:700;letter-spacing:.5px;color:var(--muted);text-transform:uppercase}
.stat b{font-size:22px;font-variant-numeric:tabular-nums}
@media (max-width:700px){.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header><b>PROJECT CONTROL <span>PRO</span> · админка</b><div class="r"><a class="btn sm" href="/" style="text-decoration:none">Сайт</a><button class="btn sm" id="out" type="button" hidden>Выйти</button></div></header>
<main id="main">
  <form class="card login" id="loginForm">
    <h2>Вход администратора</h2>
    <div class="row"><label style="flex:1">Пароль из переменной ADMIN_PASSWORD<input type="password" id="pw" autocomplete="current-password" required></label><button class="btn pri" type="submit">Войти</button></div>
    <p class="muted" id="loginMsg"></p>
  </form>
</main>
<div class="toast" id="toast" role="status"></div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dt = v => v ? new Date(v).toLocaleDateString("ru-RU") : "—";
const dtt = v => v ? new Date(v).toLocaleString("ru-RU",{dateStyle:"short",timeStyle:"short"}) : "—";
let tt; function toast(t){ const el = $("toast"); el.textContent = t; el.classList.add("on"); clearTimeout(tt); tt = setTimeout(()=>el.classList.remove("on"), 2200); }
async function api(method, url, body){
  const r = await fetch(url, {method, credentials:"same-origin", headers:{"Content-Type":"application/json","X-PCP":"1"}, body: body ? JSON.stringify(body) : undefined});
  let j = {}; try{ j = await r.json(); }catch(e){}
  if(r.status===401 && url!=="/api/admin/login"){ showLogin(); throw new Error(j.error || "Нужен вход"); }
  if(!r.ok) throw new Error(j.error || "Ошибка " + r.status);
  return j;
}
function copy(t, btn){ try{ navigator.clipboard.writeText(t).then(()=>{ if(btn){ const o = btn.textContent; btn.textContent = "Скопировано"; setTimeout(()=>btn.textContent=o,1400); } }, ()=>{}); }catch(e){} }
const mainHTML = $("main").innerHTML;
function showLogin(){ $("main").innerHTML = mainHTML; $("out").hidden = true; bindLogin(); }
function bindLogin(){ $("loginForm").addEventListener("submit", async e => { e.preventDefault(); try{ await api("POST","/api/admin/login",{password:$("pw").value}); load(); }catch(err){ $("loginMsg").textContent = err.message; } }); }

let D = null, openCo = new Set(), lastCodes = [];
async function load(){ try{ D = await api("GET","/api/admin/overview"); $("out").hidden = false; draw(); }catch(e){} }
function status(c){
  if(c.blocked) return `<span class="pill b">Приостановлен</span>`;
  const d = (new Date(c.access_until) - new Date()) / 864e5;
  return d < 0 ? `<span class="pill x">Закончился</span>` : d < 7 ? `<span class="pill w">${Math.ceil(d)} дн.</span>` : `<span class="pill g">Активен</span>`;
}
function draw(){
  const now = new Date(), act = D.companies.filter(c => !c.blocked && new Date(c.access_until) > now);
  const soon = act.filter(c => (new Date(c.access_until) - now)/864e5 < 7);
  const free = D.codes.filter(k => !k.used_at);
  const paid = D.orders.filter(o => o.status==="paid" || o.status==="paid_code"), mon = new Date(now.getFullYear(), now.getMonth(), 1);
  const monSum = paid.filter(o => new Date(o.paid_at) >= mon).reduce((a,o) => a + o.amount, 0) / 100;
  let h = `<div class="grid"><div class="stat"><small>Клиентов</small><b>${D.companies.length}</b></div><div class="stat"><small>Активны</small><b>${act.length}</b></div><div class="stat"><small>Заканчиваются за 7 дней</small><b>${soon.length}</b></div><div class="stat"><small>Оплачено в этом месяце</small><b>${new Intl.NumberFormat("ru-RU").format(monSum)} ₽</b></div></div>
  <p class="muted" style="margin:0">${D.pay.enabled ? `Оплата на сайте включена${D.pay.test ? " — <b>тестовый терминал</b>, деньги не списываются" : ""}. Тарифы: ${D.pay.plans.map(p => esc(p.title) + " — " + p.rub + " ₽").join(", ")}. Чеки 54-ФЗ через Т-Банк: ${D.pay.receipt ? "да" : "нет"}.` : "Оплата на сайте выключена: задайте TBANK_TERMINAL_KEY, TBANK_PASSWORD и PLANS в переменных приложения."} Свободных кодов: ${free.length}.</p>
  <section class="card"><h2>Новый код доступа</h2>
    <form class="row" id="codeForm">
      <label>Срок<select id="days"><option value="30">30 дней</option><option value="90">90 дней</option><option value="180">180 дней</option><option value="365">365 дней</option><option value="14">14 дней (пробный)</option></select></label>
      <label style="flex:1 1 240px">Кому / заметка<input id="note" maxlength="200" placeholder="Boosty: Иван Петров, ООО «Монтаж»"></label>
      <label>Кол-во<input id="count" type="number" min="1" max="50" value="1" style="width:80px"></label>
      <button class="btn pri" type="submit">Создать</button>
    </form>
    <p class="muted" style="margin:8px 0 0">Код подходит и для новой регистрации, и для продления: владелец вводит его в разделе «Команда и доступ», дни добавляются к сроку.</p>
    ${lastCodes.length ? `<div class="new">${lastCodes.map(c => `<div class="row" style="align-items:center"><span class="mono">${esc(c)}</span><button class="btn sm" type="button" data-copy="${esc(c)}">Копировать</button></div>`).join("")}
      <p class="muted" style="margin:8px 0 0">Текст для покупателя: «Ваш код доступа: ${esc(lastCodes[0])}. Зарегистрируйтесь на ${esc(location.origin)}/login.html#register»</p></div>` : ""}
  </section>
  <section class="card"><h2>Клиенты</h2><div class="tw"><table><thead><tr><th></th><th>Компания</th><th>Владелец</th><th>Польз.</th><th>Статус</th><th>Доступ до</th><th>Продлить</th><th>Последний вход</th><th>Заметка</th><th></th></tr></thead><tbody>`;
  if(!D.companies.length) h += `<tr><td colspan="10" class="muted">Пока никто не зарегистрировался. Создайте код и отправьте покупателю.</td></tr>`;
  D.companies.forEach(c => {
    const iso = new Date(c.access_until).toLocaleDateString("sv-SE", {timeZone:"Europe/Moscow"});
    h += `<tr><td><button class="btn sm" type="button" data-open="${c.id}" aria-label="Показать сотрудников">${openCo.has(c.id)?"▾":"▸"}</button></td>
      <td><b>${esc(c.name)}</b><div class="muted">с ${dt(c.created_at)}</div></td><td>${esc(c.owner_email||"")}</td><td class="n">${c.users}</td><td>${status(c)}</td>
      <td><input type="date" value="${iso}" data-until="${c.id}" aria-label="Доступ до"></td>
      <td class="n"><button class="btn sm" type="button" data-add="${c.id}" data-d="30">+30</button> <button class="btn sm" type="button" data-add="${c.id}" data-d="365">+365</button></td>
      <td class="n">${dtt(c.last_login)}</td>
      <td><input value="${esc(c.note||"")}" data-note="${c.id}" maxlength="200" aria-label="Заметка" style="width:180px"></td>
      <td class="n"><button class="btn sm ${c.blocked?"":"danger"}" type="button" data-block="${c.id}" data-v="${c.blocked?0:1}">${c.blocked?"Включить":"Приостановить"}</button></td></tr>`;
    if(openCo.has(c.id)){
      D.users.filter(u => u.company_id===c.id).forEach(u => {
        h += `<tr class="users"><td></td><td colspan="2">${esc(u.name)} · ${esc(u.email)}</td><td>${u.role==="owner"?"владелец":"сотрудник"}</td><td colspan="3" class="muted">вход: ${dtt(u.last_login)}</td><td colspan="3"><button class="btn sm" type="button" data-reset="${u.id}">Сбросить пароль</button> <span data-pw="${u.id}" class="mono"></span></td></tr>`;
      });
      h += `<tr class="users"><td></td><td colspan="9"><div class="row" style="align-items:center"><span class="muted">Удалить компанию и все её данные (например, по запросу клиента):</span><input placeholder="введите название компании" data-delname="${c.id}" style="width:240px"><button class="btn sm danger" type="button" data-del="${c.id}">Удалить навсегда</button></div></td></tr>`;
    }
  });
  h += `</tbody></table></div></section>
  <section class="card"><h2>Оплаты</h2><div class="tw" style="max-height:420px"><table><thead><tr><th>Создан</th><th>Заказ</th><th>Тип</th><th>Покупатель</th><th>Срок</th><th>Сумма</th><th>Статус</th></tr></thead><tbody>
    ${D.orders.length ? D.orders.map(o => { const st = o.status==="paid" ? `<span class="pill g">Оплачено</span>` : o.status==="paid_code" ? `<span class="pill w">Оплачено, выдан код</span> <span class="mono">${esc(o.code)}</span>` : o.status==="failed" ? `<span class="pill x">Не оплачено</span>` : `<span class="pill x">Ожидает</span>`;
      return `<tr><td class="n">${dtt(o.created_at)}</td><td class="mono">${esc(o.order_id)}</td><td>${o.kind==="new"?"новый кабинет":"продление"}</td><td>${esc(o.company_name||"")}<div class="muted">${esc(o.email||"")}</div></td><td class="n">${o.days} дн.</td><td class="n">${new Intl.NumberFormat("ru-RU").format(o.amount/100)} ₽</td><td>${st}${o.bank_status && !["CONFIRMED","NEW"].includes(o.bank_status) ? ` <span class="muted">${esc(o.bank_status)}</span>` : ""}</td></tr>`; }).join("") : `<tr><td colspan="7" class="muted">Оплат пока нет</td></tr>`}
  </tbody></table></div></section>
  <section class="card"><h2>Коды</h2><div class="tw" style="max-height:420px"><table><thead><tr><th>Код</th><th>Дней</th><th>Заметка</th><th>Создан</th><th>Использован</th><th></th></tr></thead><tbody>`;
  if(!D.codes.length) h += `<tr><td colspan="6" class="muted">Кодов пока нет</td></tr>`;
  D.codes.forEach(k => h += `<tr><td class="mono">${esc(k.code)} <button class="btn sm" type="button" data-copy="${esc(k.code)}">Копировать</button></td><td class="n">${k.days}</td><td>${esc(k.note||"")}</td><td class="n">${dt(k.created_at)}</td>
    <td>${k.used_at ? `<span class="pill x">${dt(k.used_at)}</span> ${esc(k.company||"")}` : `<span class="pill g">свободен</span>`}</td><td>${k.used_at?"":`<button class="btn sm danger" type="button" data-delcode="${esc(k.code)}">Удалить</button>`}</td></tr>`);
  h += `</tbody></table></div></section>`;
  $("main").innerHTML = h;
}
document.addEventListener("submit", async e => {
  if(e.target.id!=="codeForm") return; e.preventDefault();
  try{ const r = await api("POST","/api/admin/codes",{days:+$("days").value, note:$("note").value, count:+$("count").value}); lastCodes = r.codes; await load(); toast("Код создан"); }catch(err){ toast(err.message); }
});
document.addEventListener("change", async e => {
  const t = e.target;
  try{
    if(t.dataset.until){ await api("POST","/api/admin/companies/"+t.dataset.until,{accessUntil:t.value}); toast("Срок изменён"); load(); }
    if(t.dataset.note){ await api("POST","/api/admin/companies/"+t.dataset.note,{note:t.value}); toast("Заметка сохранена"); }
  }catch(err){ toast(err.message); }
});
document.addEventListener("click", async e => {
  const b = e.target.closest("button"); if(!b) return;
  try{
    if(b.id==="out"){ await api("POST","/api/admin/logout"); showLogin(); return; }
    if(b.dataset.copy){ copy(b.dataset.copy, b); return; }
    if(b.dataset.open){ const id = +b.dataset.open; openCo.has(id) ? openCo.delete(id) : openCo.add(id); draw(); return; }
    if(b.dataset.add){ await api("POST","/api/admin/companies/"+b.dataset.add,{addDays:+b.dataset.d}); toast(`Добавлено ${b.dataset.d} дн.`); load(); return; }
    if(b.dataset.block){ await api("POST","/api/admin/companies/"+b.dataset.block,{blocked:b.dataset.v==="1"}); toast(b.dataset.v==="1"?"Доступ приостановлен":"Доступ включён"); load(); return; }
    if(b.dataset.reset){
      if(b.dataset.sure!=="1"){ b.dataset.sure="1"; b.textContent="Точно сбросить?"; return; }
      const r = await api("POST","/api/admin/users/"+b.dataset.reset+"/reset");
      document.querySelector(`[data-pw="${b.dataset.reset}"]`).innerHTML = `${esc(r.password)} <button class="btn sm" type="button" data-copy="${esc(r.password)}">Копировать</button>`;
      b.textContent = "Сброшен"; b.dataset.sure=""; toast("Отправьте временный пароль клиенту"); return;
    }
    if(b.dataset.del){ const name = document.querySelector(`[data-delname="${b.dataset.del}"]`).value; await api("DELETE","/api/admin/companies/"+b.dataset.del,{confirm:name}); openCo.delete(+b.dataset.del); toast("Компания удалена"); load(); return; }
    if(b.dataset.delcode){ await api("DELETE","/api/admin/codes/"+encodeURIComponent(b.dataset.delcode)); toast("Код удалён"); load(); return; }
  }catch(err){ toast(err.message); }
});
bindLogin();
fetch("/api/admin/overview",{credentials:"same-origin"}).then(r => { if(r.ok) load(); });
</script>
</body>
</html>
